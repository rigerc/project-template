name: Media

# Captures screenshots and a tour video of the built site. Run it manually
# from the Actions tab, or locally with tool/media.sh.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: What to capture
        type: choice
        options: [all, screenshots, video]
        default: all

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: website/.nvmrc
          cache: npm
          cache-dependency-path: |
            website/package-lock.json
            tool/media/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: tool/site.sh
      - run: tool/media.sh "${{ inputs.mode }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: site-media
          path: build/media/
          if-no-files-found: error
          retention-days: 30
