name: Bug report
description: Something is not working as documented
labels: [bug]
body:
  - type: input
    id: version
    attributes: { label: Version, description: The release or commit you are using }
    validations: { required: true }
  - type: textarea
    id: steps
    attributes: { label: Steps to reproduce }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: What you expected and what happened }
    validations: { required: true }
