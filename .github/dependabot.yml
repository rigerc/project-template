version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ['*'] }
  - package-ecosystem: npm
    directory: /website
    schedule: { interval: weekly }
    groups:
      site: { patterns: ['*'] }
  - package-ecosystem: npm
    directory: /site
    schedule: { interval: weekly }
    groups:
      landing: { patterns: ['*'] }
  - package-ecosystem: npm
    directory: /tool/media
    schedule: { interval: monthly }
